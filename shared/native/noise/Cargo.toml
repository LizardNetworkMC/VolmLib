[package]
name = "volmlib-noise"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out", "hlsl-out", "msl-out"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = true
